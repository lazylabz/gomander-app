name: Tests + Upload Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-node@v5
      with:
        node-version: '24'

    - uses: pnpm/action-setup@v5
      with:
        version: 10

    - name: Install frontend dependencies
      run: pnpm install --frozen-lockfile
      working-directory: ./cmd/gomander/frontend

    # Coverage is measured but not uploaded yet: the suite covers a single module,
    # and mixing it into the Codecov project report would fail the 80% target on
    # every PR.
    - name: Run tests
      run: pnpm run test:cov
      working-directory: ./cmd/gomander/frontend

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.23.0'

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Create dummy frontend/dist directory
      run: |
        mkdir -p cmd/gomander/frontend/dist
        echo "dummy" > cmd/gomander/frontend/dist/.dummy

    - name: Run tests
      run: go test -v -race -coverpkg ./... -coverprofile coverage.txt ./...

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v6
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
